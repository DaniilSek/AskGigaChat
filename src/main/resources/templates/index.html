<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>GigaChat Интерфейс</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
        }
        form {
            margin: 20px 0;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border: 1px solid #cce0ff;
            border-radius: 4px;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
<h1>💬 GigaChat Интерфейс</h1>

<form method="post" action="/ask">
    <label for="query">Введите ваш запрос:</label><br/>
    <textarea id="query" name="query" placeholder="Например: Расскажи о птицах"></textarea><br/>
    <button type="submit">Отправить</button>
</form>

<div th:if="${error}" class="error" th:text="${error}"></div>

<div th:if="${response}" class="result">
    <strong>Вы:</strong><br/>
    <p th:text="${query}"></p>
    <strong>GigaChat:</strong><br/>
    <p th:text="${response}"></p>
</div>
</body>
</html>
